name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .3dsx
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: Globe3DS
          path: Globe3DS.3dsx
